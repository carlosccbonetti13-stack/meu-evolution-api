services:
  - type: web
    name: meu-evolution-api
    env: docker
    plan: free
    region: ohio
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: 8080
      - key: SERVER_URL
        value: https://meu-evolution-api-4kz8.onrender.com
      - key: API_VERSION
        value: v1
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: NARUTO28

      # CONEXÃO DO BANCO DE DADOS CORRIGIDA
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: "postgresql"
      # INSIRA A URL EXTERNA ABAIXO (Adicionando o .ohio-postgres.render.com correspondente ou a URL externa copiada do painel)
      - key: DATABASE_CONNECTION_URI
        value: postgresql://evolution_user:KM8vEDOIZ4AYLOXtkuubv5YenKHW52J0@://render.com
      - key: DATABASE_CONNECTION_STRING
        value: postgresql://evolution_user:KM8vEDOIZ4AYLOXtkuubv5YenKHW52J0@://render.com
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
