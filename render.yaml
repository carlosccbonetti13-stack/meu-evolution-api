services:
  - type: web
    name: meu-evolution-api
    env: docker
    plan: free
    region: ohio
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: 8080
      - key: SERVER_URL
        value: https://onrender.com
      - key: API_VERSION
        value: v1
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: sua_chave_api_super_secreta_aqui # Coloque sua senha aqui

      # CORREÇÃO DO BANCO DE DADOS
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: "postgresql"
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: evolution-db
          property: connectionString
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"

databases:
  - name: evolution-db
    plan: free
    region: ohio
    databaseName: evolution
    user: evolution_user
