services:
  - type: web
    name: evolution-api
    env: docker
    plan: free # Mude para 'web' ou outro plano pago se precisar de mais recursos
    region: ohio # Escolha a região de sua preferência
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: 8080
      - key: SERVER_URL
        value: https://onrender.com # Substitua pela URL final que o Render te der
      - key: API_VERSION
        value: v1
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: sua_chave_api_super_secreta_aqui # Troque por uma senha forte
